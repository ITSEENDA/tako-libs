plugins {
	id 'fabric-loom' apply false
	id 'org.jetbrains.kotlin.jvm' version '2.4.20' apply false
}

def targetProjects = [
	'1.20.4': ':targets:fabric:1_20_4',
	'fabric_1_20_4': ':targets:fabric:1_20_4',
	'1.21.1': ':targets:fabric:1_21_1',
	'fabric_1_21_1': ':targets:fabric:1_21_1'
]

def requestedTarget = providers.gradleProperty('target').orElse('all').get()
def selectedProjects = requestedTarget == 'all'
	? targetProjects.values().toList().unique()
	: [targetProjects[requestedTarget]]

if (selectedProjects.any { it == null }) {
	throw new GradleException(
		"Unknown target '${requestedTarget}'. Use one of: ${targetProjects.keySet().join(', ')}, all"
	)
}

def iconSvgDir = rootProject.file('assets/icons/svg')
def iconPngDir = rootProject.file('src/main/resources/assets/tako-libs/textures/gui/icons-generated')
def iconConverter = rootProject.file('scripts/svg_to_png.py')

tasks.register('generateSvgIcons', Exec) {
	inputs.dir(iconSvgDir)
	inputs.file(iconConverter)
	outputs.dir(iconPngDir)
	onlyIf { fileTree(iconSvgDir).matching { include '**/*.svg' }.files }
	doFirst {
		def pythonArgs = System.getProperty('os.name').toLowerCase().contains('windows')
			? ['py', '-3', iconConverter.absolutePath]
			: ['python3', iconConverter.absolutePath]
		commandLine(pythonArgs)
	}
}

tasks.register('buildToPath', Copy) {
	dependsOn(selectedProjects.collect { "${it}:remapJar" })
	selectedProjects.each { targetProject ->
		from(project(targetProject).tasks.named('remapJar'))
	}
	into(
		providers.gradleProperty('distDir')
			.map { file(it) }
			.orElse(file("${rootDir}/dist"))
	)
}
